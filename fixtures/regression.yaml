# Regression fixtures — misroute events frozen as test cases.
#
# Every correction SHOULD land with a fixture (propose-correction adds one
# automatically when given --fixture-finding). CI runs these on every change:
# run N+1 must route last month's corrections correctly or the build fails.
# This is what stops hand-maintained routing tables from silently decaying.

- name: corr-20260809-visual-studio-bundle
  finding:
    id: f-vs-001
    cve_id: CVE-2026-90001
    vendor: Microsoft
    product: Visual Studio 2024
    description: Remote code execution in Visual Studio project loading.
    context:
      bundle_member: false
  expect:
    disposition: routed
    channel: euc-user-installed
    rule_id: corr-20260809-visual-studio-bundle

