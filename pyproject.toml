[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vuln-evidence-registry"
version = "0.1.0"
description = "Three vulnerability-prioritisation patterns: a declarative exploitation-evidence registry (SQL gate + Python twin), the CISA BOD 26-04 remediation-timeline engine, and a learning fix-channel routing registry."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Donal Scollan" }]
keywords = ["vulnerability", "cve", "kev", "epss", "ssvc", "bod-26-04", "prioritization", "cisa", "routing", "triage", "patch-management"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
"CISA BOD 26-04" = "https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk"

[project.optional-dependencies]
test = ["pytest>=7", "PyYAML>=6.0"]
routing = ["PyYAML>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["vuln_evidence_registry", "routing_registry", "precondition_extraction"]
